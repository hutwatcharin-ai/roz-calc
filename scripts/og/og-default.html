<!doctype html><html lang="th"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0B0820;font-family:"Leelawadee UI","Leelawadee",Tahoma,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;border-radius:9999px;filter:blur(170px)}
.g1{top:-270px;left:-210px;width:660px;height:660px;background:#3DE8FF;opacity:.14}
.g2{bottom:-290px;right:-190px;width:640px;height:640px;background:#FF3D9A;opacity:.12}
.mark{font-size:108px;font-weight:700;letter-spacing:-3px;line-height:1;z-index:1}
.mark .a{color:#F4F2FF}.mark .b{color:#FFE53D}
.tag{margin-top:22px;font-size:34px;color:#B3A9E6;z-index:1}
.row{margin-top:58px;display:flex;gap:44px;z-index:1}
.cell{display:flex;flex-direction:column;align-items:center}
.n{font-size:48px;font-weight:700;color:#3DE8FF;font-variant-numeric:tabular-nums;line-height:1}
.l{font-size:24px;color:#B3A9E6;margin-top:8px}
.rule{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#3DE8FF,#FFE53D)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="mark"><span class="a">ZERO</span><span class="b">CALC</span></div>
<div class="tag">ฐานข้อมูลและเครื่องมือ Ragnarok Zero Global ภาษาไทย</div>
<div class="row">
  <div class="cell"><div class="n">524</div><div class="l">มอนสเตอร์</div></div>
  <div class="cell"><div class="n">1,300</div><div class="l">ไอเทม</div></div>
  <div class="cell"><div class="n">289</div><div class="l">การ์ด</div></div>
  <div class="cell"><div class="n">851</div><div class="l">สกิล</div></div>
  <div class="cell"><div class="n">497</div><div class="l">แมพ</div></div>
</div>
<div class="rule"></div>
</body></html>
