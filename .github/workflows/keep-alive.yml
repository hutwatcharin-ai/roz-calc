name: Keep Supabase alive

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC (~10:00 Thailand time)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the home page (triggers a real Supabase query)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://rozerothai.com/")
          echo "home page returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Site did not return 200 (got $code) — check the Coolify deployment"
          fi
