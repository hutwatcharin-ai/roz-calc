name: Banner reports

# Mails each advertiser their banner numbers (scripts/ad-mail-report.mjs).
# Runs daily at 09:00 Thailand; the script sends only on Fridays and on the
# day after a booking ends.
#
# GitHub's own schedule ran up to six hours late (08:09 and 08:17 UTC for
# 02:00, 28-29 Oct 2026), so the Coolify server starts it instead: a daily
# scheduled task at 09:00 Thailand calls this workflow's dispatch with
# GITHUB_DISPATCH_TOKEN, and a dispatch starts within seconds. The `force`
# box on "Run workflow" sends a weekly report now, whatever the day.
#
# No GitHub schedule: a late scheduled run after the Coolify one would mail
# the advertiser twice the same day.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Send a weekly report now, whatever the day'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ad-mail-report.mjs
            data/ads.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-save --no-package-lock nodemailer@6.9.16 playwright-core@1.49.1
      - name: Run
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AD_REPORT_TO: ${{ secrets.AD_REPORT_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ad-mail-report.mjs ${{ inputs.force && '--now' || '' }}
