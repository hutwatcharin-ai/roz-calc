name: Telegram reports

# @rozerothaibot (scripts/telegram-report.mjs). Times are UTC; Thailand is +7.
on:
  schedule:
    - cron: '0 7 * * *' # daily 14:00 Thailand: yesterday's visitors, once GA4 has filled the day in
    - cron: '15 2 * * 1' # Monday 09:15 Thailand: the week on Google Search
  workflow_dispatch:
    inputs:
      mode:
        description: daily, weekly or uptime (uptime runs by hand only)
        required: true
        default: daily

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/telegram-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4 # Discord posts still to do, for the daily report
        with:
          ref: discord-inbox
          path: inbox
          sparse-checkout: state.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then mode=daily
          else mode=weekly; fi
          node scripts/telegram-report.mjs "$mode"
